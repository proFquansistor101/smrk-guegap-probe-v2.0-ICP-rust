[package]
name = "registry_canister"
version = "0.2.0"
edition = "2021"

build = "build.rs"
[lib]
crate-type = ["cdylib"]

[dependencies]
ic-cdk = "0.13"
ic-cdk-macros = "0.13"
candid = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10"
hex = "0.4"
ic-stable-structures = "0.6"
